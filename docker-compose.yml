# ==============================================================================
#                Example docker-compose file for CaddyPanel
#
# How to use:
# 1. Copy this content into a file named `docker-compose.yml`.
# 2. Edit the environment variables below, especially FLASK_SECRET_KEY.
# 3. Run `docker compose up -d` in the same directory.
#
# CaddyPanel will then be accessible at http://<your_server_ip>:5000 for initial setup.
# Once Caddy is configured to manage a domain, you will access CaddyPanel through that domain.
# ==============================================================================

version: '3.8'

services:
  caddypanel:
    # Use the official image from Docker Hub.
    image: holaflenain/caddypanel:latest
    container_name: caddypanel
    restart: unless-stopped

    ports:
      # Standard ports for web traffic handled by Caddy.
      - "80:80"
      - "443:443"
      # Port for the CaddyPanel web interface (initial setup over plain HTTP).
      # SECURITY: once your admin account is created and the UI is reachable
      # through the domain managed by Caddy, close this port (comment out the
      # line below) so the panel is only served through Caddy with TLS.
      - "5000:5000"

    environment:
      # --- EDIT BELOW ---
      # Secret key to secure Flask sessions.
      # !! VERY IMPORTANT !! Replace this placeholder with a long, random
      # string BEFORE first use (generate one with: openssl rand -hex 32).
      # THE PANEL WILL NOT WORK PROPERLY UNTIL YOU DO: placeholder/short
      # values (< 32 chars) are REFUSED at startup and each gunicorn worker
      # then generates its own ephemeral key -> login loop and random CSRF
      # 400 errors (an explicit error is logged at startup).
      - FLASK_SECRET_KEY=replace-me-with-a-secure-key

      # Reverse-proxy trust: number of trusted proxy hops in front of the app.
      # Leave unset (or 0) while accessing the panel directly on port 5000:
      # forgeable X-Forwarded-For headers are then ignored, so the login rate
      # limiter cannot be bypassed by spoofing IPs. Once the panel is served
      # through the bundled Caddy reverse proxy, set it to 1 so real client
      # IPs are used for rate limiting.
      # WARNING: keeping TRUSTED_PROXY_COUNT=0 while serving the panel THROUGH
      # Caddy/nginx makes every request appear to come from the proxy's own
      # address, i.e. ONE shared rate-limit bucket for ALL clients: anyone can
      # lock /login for everybody for 5 minutes with 5 bad attempts.
      # - TRUSTED_PROXY_COUNT=1
      
      # Session cookie security: CaddyPanel sets the Secure flag on the
      # session cookie by default (requires HTTPS). If you access the panel
      # directly over plain HTTP (http://<your_server_ip>:5000) without a
      # TLS-terminating reverse proxy (Caddy) in front, uncomment the line
      # below so the session cookie is sent over HTTP:
      # - FLASK_COOKIE_SECURE=0
      
      # Path where Caddy will write JSON access logs (used by the Stats page).
      # This must match the supervisord stdout_logfile path.
      - CADDY_ACCESS_LOG_FILE=/var/log/caddy_panel/caddy_access.json.log
      
      # Timezone for Caddy and application logs to be accurate.
      # List of timezones: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=Etc/UTC
      
      # Optional: MaxMind credentials for GeoIP (country statistics on the Stats page).
      # Get a free account at https://www.maxmind.com/en/geolite2/signup
      # The GeoLite2-Country.mmdb database will be auto-downloaded on first start.
      # You can also enter these in the Preferences page of the UI instead.
      # - MAXMIND_ACCOUNT_ID=your-account-id
      # - MAXMIND_LICENSE_KEY=your-license-key

    volumes:
      # Volume for Caddy's configuration (Caddyfile).
      # The leading './' means the 'caddy_config' folder will be created
      # in the same directory as this docker-compose.yml file.
      - ./caddy_config:/etc/caddy
      
      # Volume for Caddy's data (SSL certificates, etc.).
      - ./caddy_data:/data
      
      # Volume for CaddyPanel's data (users, preferences).
      - ./caddypanel_data:/app_data

      # Volume for Caddy and Supervisor logs (JSON access logs for stats).
      - ./caddy_logs:/var/log/caddy_panel