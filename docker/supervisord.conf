[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root ; supervisor itself needs to run as root to manage processes that might need root (like Caddy for low ports initially)

[program:caddy]
command=/usr/bin/caddy run --config %(ENV_CADDY_CONFIG_FILE)s --adapter caddyfile
directory=/
autostart=true
autorestart=true
# Redirect stdout (where Caddy will send JSON logs) to a file.
# stderr will still go to the container's error output for Caddy's own errors.
stdout_logfile=/var/log/caddy_panel/caddy_access.json.log # File for JSON logs
stdout_logfile_maxbytes=50MB                  # Manage the log file size
stdout_logfile_backups=5                      # Number of backups to keep
stderr_logfile=/dev/stderr                    # Caddy errors will still go to stderr
stderr_logfile_maxbytes=0                     # No limit for stderr
user=appuser
# supervisord does NOT update HOME when dropping to a non-root user, so the
# program would inherit HOME=/root from the root supervisord. Fix it so Caddy
# and any home-relative path resolution behave correctly for appuser.
environment=HOME="/home/appuser"
# Caddy can run as appuser thanks to the cap_net_bind_service capability
# set in the Dockerfile (setcap cap_net_bind_service=+ep /usr/bin/caddy).


[program:flaskapp]
command=gunicorn --workers 4 --bind 0.0.0.0:%(ENV_FLASK_PORT)s app:app
directory=%(ENV_FLASK_APP_DIR)s
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=appuser
environment=HOME="/home/appuser",FLASK_SECRET_KEY="%(ENV_FLASK_SECRET_KEY)s",APP_DATA_DIR="%(ENV_APP_DATA_DIR)s",CADDY_CONFIG="%(ENV_CADDY_CONFIG_FILE)s",CADDY_CONFIG_FILE="%(ENV_CADDY_CONFIG_FILE)s",CADDY_ACCESS_LOG_FILE="%(ENV_CADDY_ACCESS_LOG_FILE)s",FLASK_PORT="%(ENV_FLASK_PORT)s"
; Note: FLASK_SECRET_KEY MUST be provided via the container environment with a
; STRONG RANDOM value — generate one with: openssl rand -hex 32
; (e.g. `docker run -e FLASK_SECRET_KEY=$(openssl rand -hex 32) ...`).
; Placeholder or short values (< 32 chars) are REFUSED at startup: each gunicorn
; worker then generates its own ephemeral key and the panel becomes UNUSABLE
; (login loop, random CSRF errors) until a proper key is set.
; The other environment variables are defined in the Dockerfile or here for clarity.
