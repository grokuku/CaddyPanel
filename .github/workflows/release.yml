# Manual versioned release. Triggered ONLY via workflow_dispatch — never on
# push/PR.
#
# The `quality` job is the GATE that the old release.yml lacked: `publish`
# `needs: quality`, so it is IMPOSSIBLE to publish :latest / :<version> images
# with a red test suite.
#
# Flow: quality (pytest + front-end) -> publish (buildx multi-arch amd64+arm64,
# push :latest and :<version> to GHCR AND Docker Hub) -> bump the PATCH number
# in version.txt -> commit & push the bump.
name: Release

on:
  workflow_dispatch:

# Releases must never cancel each other.
concurrency:
  group: release
  cancel-in-progress: false

# Minimal permissions: write contents (commit the version.txt bump) + write
# packages (push to GHCR).
permissions:
  contents: write
  packages: write

env:
  # Docker Hub image name MUST match docker-compose.yml / README.md.
  DOCKERHUB_IMAGE: holaflenain/caddypanel

jobs:
  # Identical gate to ci.yml's `quality` job.
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile Python sources (syntax check)
        run: |
          find . -path ./.venv -prune -o -name '*.py' -print0 \
            | xargs -0 python -m py_compile

      - name: Run pytest
        run: python -m pytest -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24, NOT 20: jsdom@30 requires node ^22.22.2 || ^24.15.0 || >=26.
          node-version: "24"

      - name: Install jsdom (dev only — not a committed dependency)
        run: npm install --no-save jsdom@^30

      - name: Run front-end tests
        run: node tests/test_frontend.js

  publish:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # GHCR image names MUST be lowercase; github.repository keeps the repo's
      # original casing -> lowercase it here.
      - name: Compute lowercase GHCR image ref
        id: meta
        run: echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub login uses the DOCKER_USERNAME / DOCKER_PASSWORD secrets
      # configured for the holaflenain account (same secrets as before).
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Multi-arch (amd64 + arm64) build & push of the RELEASE images to both
      # registries. OCI labels are fed by VERSION/GIT_COMMIT build-args.
      - name: Build and push release images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.ghcr }}:latest
            ${{ steps.meta.outputs.ghcr }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }}

      - name: Increment version
        run: |
          CURRENT=$(tr -d '[:space:]' < version.txt)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "$NEW_VERSION" > version.txt
          echo "New version: $NEW_VERSION"

      - name: Commit new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: bump version to $(tr -d '[:space:]' < version.txt)"
          git push
