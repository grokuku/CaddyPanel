# Manual versioned release: builds the single CaddyPanel image and pushes it
# to Docker Hub (holaflenain/caddypanel) tagged with the version read from
# version.txt (MAJOR.MINOR.PATCH), plus `latest`. Then bumps the PATCH number
# in version.txt and commits it back to main.
#
# Triggered manually ONLY (workflow_dispatch) — it never runs on push/PR.
# The pytest suite is handled separately by tests.yml.
name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the version.txt bump

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub is the default registry — no `registry:` input needed.
      # Login uses the DOCKER_USERNAME / DOCKER_PASSWORD secrets configured
      # for the holaflenain account.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Version/commit are injected as build-args and baked into the OCI
      # labels declared in the final stage of the Dockerfile
      # (ARG VERSION / ARG GIT_COMMIT + LABEL org.opencontainers.image.*).
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            holaflenain/caddypanel:${{ steps.version.outputs.version }}
            holaflenain/caddypanel:latest

      - name: Increment version
        run: |
          CURRENT=$(cat version.txt | tr -d '[:space:]')
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "$NEW_VERSION" > version.txt
          echo "New version: $NEW_VERSION"

      - name: Commit new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: bump version to $(cat version.txt)"
          git push
