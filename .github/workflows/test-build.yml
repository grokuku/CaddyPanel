# Manual "smoke test" build: compiles the single CaddyPanel image for
# linux/amd64 + linux/arm64 and pushes it to Docker Hub as
# holaflenain/caddypanel:test, without touching version.txt and without any
# commit. Useful to validate a Dockerfile / build context change before
# cutting a real release.
#
# Triggered manually ONLY (workflow_dispatch). The pytest suite runs
# independently in tests.yml.
name: Test Build

on:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout only — no commit/bump in this workflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub is the default registry — no `registry:` input needed.
      # Login uses the DOCKER_USERNAME / DOCKER_PASSWORD secrets configured
      # for the holaflenain account.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Version/commit are injected as build-args and baked into the OCI
      # labels. Tagged :test only — never overwrites a versioned or latest tag.
      - name: Build and push image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            holaflenain/caddypanel:test
